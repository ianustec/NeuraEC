# A merge into main is a release. This builds the three downloads and publishes them.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          version=$(awk '/^version:/ { print $2 }' app/pubspec.yaml | cut -d+ -f1)
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

  macos:
    # The notarized disk image is built on the IANUSTEC Mac. A push to main does not replace it.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: version
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Freeze the engine and build the disk image
        env:
          NEURA_SIGN_IDENTITY: ${{ secrets.NEURA_SIGN_IDENTITY }}
          NEURA_NOTARY_PROFILE: ${{ secrets.NEURA_NOTARY_PROFILE }}
        run: |
          set -euo pipefail
          cd engine
          python3 -m venv .venv
          .venv/bin/python -m pip install -U pip
          .venv/bin/python -m pip install -e ".[encoder,gmail,graph]" pyinstaller
          cd ..
          app/tool/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: app/dist/NeuraEC.dmg
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Freeze the engine
        shell: pwsh
        run: |
          Set-Location engine
          python -m venv .venv
          .\.venv\Scripts\python -m pip install -U pip
          .\.venv\Scripts\python -m pip install -e ".[encoder,gmail,graph]" pyinstaller
          .\.venv\Scripts\python -m pip install torch --index-url https://download.pytorch.org/whl/cpu --upgrade
          .\.venv\Scripts\python packaging/export_model.py dist/model
          .\.venv\Scripts\pyinstaller --noconfirm --workpath build/pyinstaller --distpath dist packaging/neura-engine.spec
      - name: Build the window and pack it
        shell: pwsh
        env:
          NEURA_WIN_PFX: ${{ secrets.NEURA_WIN_PFX }}
          NEURA_WIN_PFX_PASSWORD: ${{ secrets.NEURA_WIN_PFX_PASSWORD }}
        run: |
          Set-Location app
          flutter build windows --release
          $release = "build/windows/x64/runner/Release"
          Copy-Item -Recurse "../engine/dist/neura-engine" "$release/engine"
          Copy-Item -Recurse "../engine/dist/model" "$release/model"
          $pfx = "$env:RUNNER_TEMP\ianustec.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:NEURA_WIN_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          foreach ($exe in @("$release\neura_app.exe", "$release\engine\neura-engine.exe")) {
            & $signtool sign /f $pfx /p $env:NEURA_WIN_PFX_PASSWORD /fd SHA256 /d "NeuraEC" $exe
          }
          Compress-Archive -Path "$release/*" -DestinationPath "../NeuraEC-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: NeuraEC-Windows.zip
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries for the window
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Freeze the engine and pack the window
        env:
          NEURA_GPG_PRIVATE: ${{ secrets.NEURA_GPG_PRIVATE }}
          NEURA_GPG_PASSPHRASE: ${{ secrets.NEURA_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd engine
          python3 -m venv .venv
          .venv/bin/python -m pip install -U pip
          .venv/bin/python -m pip install -e ".[encoder,gmail,graph]" pyinstaller
          .venv/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu --upgrade
          .venv/bin/python packaging/export_model.py dist/model
          .venv/bin/pyinstaller --noconfirm --workpath build/pyinstaller --distpath dist packaging/neura-engine.spec
          cd ../app
          flutter build linux --release
          bundle="build/linux/x64/release/bundle"
          cp -a ../engine/dist/neura-engine "$bundle/engine"
          cp -a ../engine/dist/model "$bundle/model"
          tar -C build/linux/x64/release -czf "$GITHUB_WORKSPACE/NeuraEC-Linux.tar.gz" bundle
          gpg --batch --import <<< "$NEURA_GPG_PRIVATE"
          gpg --batch --pinentry-mode loopback --passphrase "$NEURA_GPG_PASSPHRASE" \
            --detach-sign --armor "$GITHUB_WORKSPACE/NeuraEC-Linux.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            NeuraEC-Linux.tar.gz
            NeuraEC-Linux.tar.gz.asc
          if-no-files-found: error

  publish:
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          win="dist/windows/NeuraEC-Windows.zip"
          lin="dist/linux/NeuraEC-Linux.tar.gz"
          sig="dist/linux/NeuraEC-Linux.tar.gz.asc"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$win" "$lin" "$sig" --clobber
          else
            notes="Desktop builds of NeuraEC ${TAG}.

            - macOS (Apple Silicon): NeuraEC.dmg, signed by IANUSTEC and notarized by Apple.
            - Windows: NeuraEC-Windows.zip. Unzip and run neura_app.exe.
            - Linux: NeuraEC-Linux.tar.gz. Unpack and run bundle/neura_app. The .asc file is the IANUSTEC signature.

            The engine and the language model are inside each download. Mail stays on your computer."
            gh release create "$TAG" \
              --title "NeuraEC $TAG" \
              --notes "$notes" \
              "$win" "$lin" "$sig"
          fi
